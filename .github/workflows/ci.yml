name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (release gate and build output)
        run: python3 tests/test_release_gate.py
      - name: Check for missing content
        run: python3 scripts/build.py --check
      - name: Build the site
        run: python3 scripts/build.py
